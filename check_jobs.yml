name: Check Liquid Death Jobs

on:
  schedule:
    # GitHub Actions cron is UTC-only and does not shift for daylight saving.
    # 5pm ET = 21:00 UTC during EDT (Mar-Nov) and 22:00 UTC during EST (Nov-Mar).
    # We trigger at both times; check_jobs.py checks the real US/Eastern clock
    # and skips (does nothing, no email) on whichever run isn't actually 5pm ET.
    - cron: "0 21 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch: {}  # lets you manually trigger a run from the Actions tab

permissions:
  contents: write  # needed to commit the updated seen_jobs.json back to the repo

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job check
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python check_jobs.py

      - name: Commit updated job state
        run: |
          git config user.name "job-alert-bot"
          git config user.email "action@github.com"
          git add seen_jobs.json
          git diff --staged --quiet && echo "No state changes to commit" || git commit -m "Update seen jobs [skip ci]"
          git push
